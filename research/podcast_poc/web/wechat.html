<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>公众号阅读 · KOL</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/wechat.css">
  <link rel="stylesheet" href="/reader-auth.css">
  <script src="/reader-auth.js" defer></script>
  <script src="/wechat.js" defer></script>
</head>
<body class="wx-page" data-mobile-pane="reader">
  <a class="skip" href="#reader">跳到阅读区</a>
  <header class="masthead">
    <div class="brand"><span class="brand-mark" aria-hidden="true">◖</span><span>KOL <b>阅读</b></span></div>
    <nav class="content-nav" aria-label="内容导航"><a href="/">播客</a><a href="/wechat" aria-current="page">公众号</a></nav>
    <span class="local-label"><span aria-hidden="true"></span>本地体验版</span>
  </header>
  <div class="collection-bar"><h1>公众号阅读</h1><p id="collection-status" aria-live="polite">正在读取文章…</p><button id="refresh" class="quiet-button" type="button">刷新列表</button></div>
  <div class="workspace wx-workspace">
    <aside id="article-inbox" class="inbox" aria-label="文章列表" tabindex="-1">
      <div class="inbox-heading"><h2>文章清单</h2><span id="article-count" aria-live="polite">—</span></div>
      <button id="show-reader" class="mobile-continue" type="button" hidden>继续阅读当前文章</button>
      <div class="filters" role="group" aria-label="文章分类"><button type="button" data-category="all" aria-pressed="true">全部</button><button type="button" data-category="finance" aria-pressed="false">财经</button><button type="button" data-category="ai" aria-pressed="false">AI</button><button type="button" data-category="tech" aria-pressed="false">技术</button></div>
      <label class="search-label article-search-label" for="article-search">搜索标题与已获取正文</label>
      <div class="search-row"><input id="article-search" class="segment-search" type="search" placeholder="公司、主题或关键词" autocomplete="off"><button id="clear-search" type="button" aria-label="清除搜索" hidden>清除</button></div>
      <div id="article-list" class="episode-list"><p class="empty">正在加载…</p></div>
      <details id="automation-details" class="source-overview automation-overview"><summary>自动检查 <span id="automation-status">正在读取…</span></summary><div id="automation-info"></div></details>
      <details id="source-details" class="source-overview"><summary>订阅来源 <span id="source-count">正在检查…</span></summary><div id="sources" class="sources"></div><p class="source-footnote" data-local-copy data-kol-copy="按 RSS 发布时间排序，不代表热度。刷新列表读取最新处理结果。">按 RSS 发布时间排序，不代表热度。刷新列表只重读本地结果。</p></details>
    </aside>
    <main id="reader" class="reader wx-reader" tabindex="-1"><div class="reading-empty"><h2>正在准备阅读内容</h2><p>文章加载后即可查看要点和来源文字。</p></div></main>
  </div>
  <p id="reading-announcement" class="sr-only" role="status" aria-live="polite"></p>
  <footer class="page-footer wx-footer" data-local-copy data-kol-copy="摘要用于定位观点，出处用于核对语境。">本地阅读 POC。摘要用于定位观点，出处用于核对语境。</footer>
</body>
</html>
